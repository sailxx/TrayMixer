name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write       # create the release
  id-token: write       # sign build provenance
  attestations: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build
        shell: cmd
        run: build.cmd
      - name: SHA-256
        shell: pwsh
        run: |
          $h = Get-FileHash TrayMixer-Setup.exe -Algorithm SHA256
          $h.Hash | Out-File -Encoding ascii TrayMixer-Setup.exe.sha256
          $h2 = Get-FileHash TrayMixer.exe -Algorithm SHA256
          $h2.Hash | Out-File -Encoding ascii TrayMixer.exe.sha256
      - name: Release
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda # v2.2.1
        with:
          files: |
            TrayMixer-Setup.exe
            TrayMixer-Setup.exe.sha256
            TrayMixer.exe
            TrayMixer.exe.sha256