name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build
        shell: cmd
        run: build.cmd
      - name: Test installer
        shell: cmd
        run: installer\test.cmd
      - name: Validate release version
        shell: pwsh
        run: |
          $version = [version](Get-Item TrayMixer.exe).VersionInfo.FileVersion
          if ($env:GITHUB_REF_NAME -ne "v$($version.ToString(3))") { throw "Release tag must match the app version" }
      - name: Attest installer
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: TrayMixer-Setup.exe
      - name: Installer checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash TrayMixer-Setup.exe -Algorithm SHA256).Hash
          "### SHA-256`n``````text`n$hash  TrayMixer-Setup.exe`n``````" | Set-Content release-notes.md
      - name: Release
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda # v2.2.1
        with:
          body_path: release-notes.md
          files: TrayMixer-Setup.exe
          fail_on_unmatched_files: true
