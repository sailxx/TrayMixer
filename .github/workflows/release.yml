name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build
        shell: cmd
        run: build.cmd
      - name: Test installer
        shell: cmd
        run: installer\test.cmd
      - name: Validate release version
        shell: pwsh
        run: |
          $version = [version](Get-Item TrayMixer.exe).VersionInfo.FileVersion
          if ($env:GITHUB_REF_NAME -ne "v$($version.ToString(3))") { throw "Release tag must match the app version" }
      - name: Generate checksums
        shell: pwsh
        run: |
          foreach ($file in 'TrayMixer-Setup.exe', 'TrayMixer.exe') {
            $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $file" | Set-Content "$file.sha256" -Encoding ascii -NoNewline
          }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: traymixer-windows-release
          path: |
            TrayMixer-Setup.exe
            TrayMixer-Setup.exe.sha256
            TrayMixer.exe
            TrayMixer.exe.sha256
          if-no-files-found: error

  release:
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: traymixer-windows-release
      - name: Verify checksums and write release notes
        shell: pwsh
        run: |
          $checksums = foreach ($file in 'TrayMixer-Setup.exe', 'TrayMixer.exe') {
            $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLowerInvariant()
            if ((Get-Content "$file.sha256" -Raw) -cne "$hash  $file") { throw "Checksum mismatch for $file" }
            "$hash  $file"
          }
          @(
            '## Windows 11 x64'
            ''
            '- Added a dark Frosted Glass theme that blurs the desktop wallpaper. Choose it from Settings in the tray menu.'
            '- The mixer, tray menus, and settings dialogs follow the chosen theme. Fixed uneven hover highlights, dark strips behind labels, and square corners in settings dialogs.'
            '- Added a thin playback timeline to the mini-player. For players that support seeking, click or drag the timeline to jump to a new position. The timeline moves smoothly and holds the requested position while the player responds.'
            ''
            '### SHA-256'
            ''
            '```text'
            $checksums
            '```'
          ) | Set-Content release-notes.md
      - name: Attest Windows binaries
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            TrayMixer-Setup.exe
            TrayMixer.exe
      - name: Publish Windows release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create --verify-tag --title "TrayMixer $env:TAG" --notes-file release-notes.md --repo "$env:GITHUB_REPOSITORY" -- "$env:TAG" TrayMixer-Setup.exe TrayMixer-Setup.exe.sha256 TrayMixer.exe TrayMixer.exe.sha256
