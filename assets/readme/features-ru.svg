<svg xmlns='http://www.w3.org/2000/svg' width='880' height='362' viewBox='0 0 880 362' role='img' aria-label='Возможности TrayMixer'><defs><linearGradient id='bg' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='#202020'/><stop offset='1' stop-color='#1a1d24'/></linearGradient><radialGradient id='glow' cx='0.85' cy='0.1' r='0.8'><stop offset='0' stop-color='#4CC2FF' stop-opacity='0.28'/><stop offset='1' stop-color='#4CC2FF' stop-opacity='0'/></radialGradient><radialGradient id='glow2' cx='0.05' cy='1' r='0.7'><stop offset='0' stop-color='#7A5CFF' stop-opacity='0.16'/><stop offset='1' stop-color='#7A5CFF' stop-opacity='0'/></radialGradient><linearGradient id='tile' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='#5AC8FA'/><stop offset='1' stop-color='#0A64D8'/></linearGradient><linearGradient id='stroke' x1='0' y1='0' x2='0' y2='1'><stop offset='0' stop-color='#fff' stop-opacity='0.14'/><stop offset='1' stop-color='#fff' stop-opacity='0.05'/></linearGradient></defs><style>text{font-family:'Segoe UI Variable Display','Segoe UI Variable Text','Segoe UI',-apple-system,BlinkMacSystemFont,Inter,Roboto,'Helvetica Neue',Arial,sans-serif;}</style><text x='4' y='26' font-size='13' font-weight='600' fill='#4CC2FF'>ВОЗМОЖНОСТИ</text><rect x='0.5' y='44.5' width='283' height='151' rx='8' fill='url(#bg)' stroke='url(#stroke)'/><rect x='20' y='64' width='40' height='40' rx='8' fill='#4CC2FF' fill-opacity='0.12'/><path stroke='#4CC2FF' stroke-width='2' fill='none' stroke-linecap='round' stroke-linejoin='round' d='M32 88v-3a8 8 0 0 1 16 0v3m-16 0v5h4v-7h-4m16 2v5h-4v-7h4'/><text x='76' y='90' font-size='17' font-weight='600' fill='#fff'>Все устройства</text><text x='20' y='132' font-size='13' font-weight='400' fill='#fff' fill-opacity='0.72'>Наушники, колонки, монитор — у</text><text x='20' y='152' font-size='13' font-weight='400' fill='#fff' fill-opacity='0.72'>каждого свой ползунок. Клик по имени</text><text x='20' y='172' font-size='13' font-weight='400' fill='#fff' fill-opacity='0.72'>делает его основным.</text><rect x='298.5' y='44.5' width='283' height='151' rx='8' fill='url(#bg)' stroke='url(#stroke)'/><rect x='318' y='64' width='40' height='40' rx='8' fill='#4CC2FF' fill-opacity='0.12'/><rect stroke='#4CC2FF' stroke-width='2' fill='none' stroke-linecap='round' stroke-linejoin='round' x='329' y='75' width='18' height='18' rx='4'/><path stroke='#4CC2FF' stroke-width='2' fill='none' stroke-linecap='round' stroke-linejoin='round' d='M334 84h8M338 80v8'/><text x='374' y='90' font-size='17' font-weight='600' fill='#fff'>Каждое приложение</text><text x='318' y='132' font-size='13' font-weight='400' fill='#fff' fill-opacity='0.72'>Браузер, игра и Discord — отдельно, с</text><text x='318' y='152' font-size='13' font-weight='400' fill='#fff' fill-opacity='0.72'>их иконками. Несколько вкладок =</text><text x='318' y='172' font-size='13' font-weight='400' fill='#fff' fill-opacity='0.72'>одна строка.</text><rect x='596.5' y='44.5' width='283' height='151' rx='8' fill='url(#bg)' stroke='url(#stroke)'/><rect x='616' y='64' width='40' height='40' rx='8' fill='#4CC2FF' fill-opacity='0.12'/><rect stroke='#4CC2FF' stroke-width='2' fill='none' stroke-linecap='round' stroke-linejoin='round' x='626' y='76' width='20' height='16' rx='3'/><path stroke='#4CC2FF' stroke-width='2' fill='none' stroke-linecap='round' stroke-linejoin='round' d='M626 81h20'/><text x='672' y='90' font-size='17' font-weight='600' fill='#fff'>Родной Windows 11</text><text x='616' y='132' font-size='13' font-weight='400' fill='#fff' fill-opacity='0.72'>Mica или Acrylic, скруглённые углы,</text><text x='616' y='152' font-size='13' font-weight='400' fill='#fff' fill-opacity='0.72'>тёмная и светлая тема, ваш цвет</text><text x='616' y='172' font-size='13' font-weight='400' fill='#fff' fill-opacity='0.72'>акцента.</text><rect x='0.5' y='210.5' width='283' height='151' rx='8' fill='url(#bg)' stroke='url(#stroke)'/><rect x='20' y='230' width='40' height='40' rx='8' fill='#4CC2FF' fill-opacity='0.12'/><path stroke='#4CC2FF' stroke-width='2' fill='none' stroke-linecap='round' stroke-linejoin='round' d='M31 250s3-6 9-6 9 6 9 6-3 6-9 6-9-6-9-6zM32 242l16 16'/><text x='76' y='256' font-size='17' font-weight='600' fill='#fff'>Ничего лишнего</text><text x='20' y='298' font-size='13' font-weight='400' fill='#fff' fill-opacity='0.72'>Правый клик — скрыть строку. Вернуть</text><text x='20' y='318' font-size='13' font-weight='400' fill='#fff' fill-opacity='0.72'>можно в меню трея. Всё запоминается.</text><rect x='298.5' y='210.5' width='283' height='151' rx='8' fill='url(#bg)' stroke='url(#stroke)'/><rect x='318' y='230' width='40' height='40' rx='8' fill='#4CC2FF' fill-opacity='0.12'/><path stroke='#4CC2FF' stroke-width='2' fill='none' stroke-linecap='round' stroke-linejoin='round' d='M339 240l-8 12h7l-1 8 8-12h-7z'/><text x='374' y='256' font-size='17' font-weight='600' fill='#fff'>Мгновенно и легко</text><text x='318' y='298' font-size='13' font-weight='400' fill='#fff' fill-opacity='0.72'>Слушает события Windows вместо</text><text x='318' y='318' font-size='13' font-weight='400' fill='#fff' fill-opacity='0.72'>опроса: 0% CPU в простое и около 2</text><text x='318' y='338' font-size='13' font-weight='400' fill='#fff' fill-opacity='0.72'>МБ памяти.</text><rect x='596.5' y='210.5' width='283' height='151' rx='8' fill='url(#bg)' stroke='url(#stroke)'/><rect x='616' y='230' width='40' height='40' rx='8' fill='#4CC2FF' fill-opacity='0.12'/><path stroke='#4CC2FF' stroke-width='2' fill='none' stroke-linecap='round' stroke-linejoin='round' d='M636 240l8 3v6c0 5-3.5 9-8 11-4.5-2-8-6-8-11v-6zM632.5 250l2.5 2.5 4.5-5'/><text x='672' y='256' font-size='17' font-weight='600' fill='#fff'>Безопасно</text><text x='616' y='298' font-size='13' font-weight='400' fill='#fff' fill-opacity='0.72'>Без интернета и прав админа.</text><text x='616' y='318' font-size='13' font-weight='400' fill='#fff' fill-opacity='0.72'>Открытый код, сборка на GitHub с</text><text x='616' y='338' font-size='13' font-weight='400' fill='#fff' fill-opacity='0.72'>подтверждением происхождения.</text></svg>