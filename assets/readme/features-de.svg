<svg xmlns='http://www.w3.org/2000/svg' width='880' height='362' viewBox='0 0 880 362' role='img' aria-label='Funktionen von TrayMixer'><defs><linearGradient id='bg' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='#202020'/><stop offset='1' stop-color='#1a1d24'/></linearGradient><radialGradient id='glow' cx='0.85' cy='0.1' r='0.8'><stop offset='0' stop-color='#4CC2FF' stop-opacity='0.28'/><stop offset='1' stop-color='#4CC2FF' stop-opacity='0'/></radialGradient><radialGradient id='glow2' cx='0.05' cy='1' r='0.7'><stop offset='0' stop-color='#7A5CFF' stop-opacity='0.16'/><stop offset='1' stop-color='#7A5CFF' stop-opacity='0'/></radialGradient><linearGradient id='tile' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='#5AC8FA'/><stop offset='1' stop-color='#0A64D8'/></linearGradient><linearGradient id='stroke' x1='0' y1='0' x2='0' y2='1'><stop offset='0' stop-color='#fff' stop-opacity='0.14'/><stop offset='1' stop-color='#fff' stop-opacity='0.05'/></linearGradient></defs><style>text{font-family:'Segoe UI Variable Display','Segoe UI Variable Text','Segoe UI',-apple-system,BlinkMacSystemFont,Inter,Roboto,'Helvetica Neue',Arial,sans-serif;}</style><text x='4' y='26' font-size='13' font-weight='600' fill='#4CC2FF'>FUNKTIONEN</text><rect x='0.5' y='44.5' width='283' height='151' rx='8' fill='url(#bg)' stroke='url(#stroke)'/><rect x='20' y='64' width='40' height='40' rx='8' fill='#4CC2FF' fill-opacity='0.12'/><path stroke='#4CC2FF' stroke-width='2' fill='none' stroke-linecap='round' stroke-linejoin='round' d='M32 88v-3a8 8 0 0 1 16 0v3m-16 0v5h4v-7h-4m16 2v5h-4v-7h4'/><text x='76' y='90' font-size='17' font-weight='600' fill='#fff'>Alle Geräte</text><text x='20' y='132' font-size='13' font-weight='400' fill='#fff' fill-opacity='0.72'>Kopfhörer, Lautsprecher, Monitor —</text><text x='20' y='152' font-size='13' font-weight='400' fill='#fff' fill-opacity='0.72'>jedes mit eigenem Regler. Klick auf den</text><text x='20' y='172' font-size='13' font-weight='400' fill='#fff' fill-opacity='0.72'>Namen macht es zum Standard.</text><rect x='298.5' y='44.5' width='283' height='151' rx='8' fill='url(#bg)' stroke='url(#stroke)'/><rect x='318' y='64' width='40' height='40' rx='8' fill='#4CC2FF' fill-opacity='0.12'/><rect stroke='#4CC2FF' stroke-width='2' fill='none' stroke-linecap='round' stroke-linejoin='round' x='329' y='75' width='18' height='18' rx='4'/><path stroke='#4CC2FF' stroke-width='2' fill='none' stroke-linecap='round' stroke-linejoin='round' d='M334 84h8M338 80v8'/><text x='374' y='90' font-size='17' font-weight='600' fill='#fff'>Jede App</text><text x='318' y='132' font-size='13' font-weight='400' fill='#fff' fill-opacity='0.72'>Browser, Spiel und Discord getrennt, mit</text><text x='318' y='152' font-size='13' font-weight='400' fill='#fff' fill-opacity='0.72'>ihren Symbolen. Viele Tabs = eine Zeile.</text><rect x='596.5' y='44.5' width='283' height='151' rx='8' fill='url(#bg)' stroke='url(#stroke)'/><rect x='616' y='64' width='40' height='40' rx='8' fill='#4CC2FF' fill-opacity='0.12'/><rect stroke='#4CC2FF' stroke-width='2' fill='none' stroke-linecap='round' stroke-linejoin='round' x='626' y='76' width='20' height='16' rx='3'/><path stroke='#4CC2FF' stroke-width='2' fill='none' stroke-linecap='round' stroke-linejoin='round' d='M626 81h20'/><text x='672' y='90' font-size='17' font-weight='600' fill='#fff'>Echtes Windows 11</text><text x='616' y='132' font-size='13' font-weight='400' fill='#fff' fill-opacity='0.72'>Mica oder Acrylic, abgerundete Ecken,</text><text x='616' y='152' font-size='13' font-weight='400' fill='#fff' fill-opacity='0.72'>helles und dunkles Design, deine</text><text x='616' y='172' font-size='13' font-weight='400' fill='#fff' fill-opacity='0.72'>Akzentfarbe.</text><rect x='0.5' y='210.5' width='283' height='151' rx='8' fill='url(#bg)' stroke='url(#stroke)'/><rect x='20' y='230' width='40' height='40' rx='8' fill='#4CC2FF' fill-opacity='0.12'/><path stroke='#4CC2FF' stroke-width='2' fill='none' stroke-linecap='round' stroke-linejoin='round' d='M31 250s3-6 9-6 9 6 9 6-3 6-9 6-9-6-9-6zM32 242l16 16'/><text x='76' y='256' font-size='17' font-weight='600' fill='#fff'>Nichts Überflüssiges</text><text x='20' y='298' font-size='13' font-weight='400' fill='#fff' fill-opacity='0.72'>Rechtsklick blendet eine Zeile aus.</text><text x='20' y='318' font-size='13' font-weight='400' fill='#fff' fill-opacity='0.72'>Zurückholen im Tray-Menü. Alles wird</text><text x='20' y='338' font-size='13' font-weight='400' fill='#fff' fill-opacity='0.72'>gespeichert.</text><rect x='298.5' y='210.5' width='283' height='151' rx='8' fill='url(#bg)' stroke='url(#stroke)'/><rect x='318' y='230' width='40' height='40' rx='8' fill='#4CC2FF' fill-opacity='0.12'/><path stroke='#4CC2FF' stroke-width='2' fill='none' stroke-linecap='round' stroke-linejoin='round' d='M339 240l-8 12h7l-1 8 8-12h-7z'/><text x='374' y='256' font-size='17' font-weight='600' fill='#fff'>Schnell und leicht</text><text x='318' y='298' font-size='13' font-weight='400' fill='#fff' fill-opacity='0.72'>Hört auf Windows-Ereignisse statt</text><text x='318' y='318' font-size='13' font-weight='400' fill='#fff' fill-opacity='0.72'>abzufragen: 0% CPU im Leerlauf und etwa</text><text x='318' y='338' font-size='13' font-weight='400' fill='#fff' fill-opacity='0.72'>2 MB RAM.</text><rect x='596.5' y='210.5' width='283' height='151' rx='8' fill='url(#bg)' stroke='url(#stroke)'/><rect x='616' y='230' width='40' height='40' rx='8' fill='#4CC2FF' fill-opacity='0.12'/><path stroke='#4CC2FF' stroke-width='2' fill='none' stroke-linecap='round' stroke-linejoin='round' d='M636 240l8 3v6c0 5-3.5 9-8 11-4.5-2-8-6-8-11v-6zM632.5 250l2.5 2.5 4.5-5'/><text x='672' y='256' font-size='17' font-weight='600' fill='#fff'>Sicher</text><text x='616' y='298' font-size='13' font-weight='400' fill='#fff' fill-opacity='0.72'>Kein Internet, keine Adminrechte. Open</text><text x='616' y='318' font-size='13' font-weight='400' fill='#fff' fill-opacity='0.72'>Source, auf GitHub gebaut mit</text><text x='616' y='338' font-size='13' font-weight='400' fill='#fff' fill-opacity='0.72'>Herkunftsnachweis.</text></svg>